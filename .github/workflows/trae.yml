name: trae 打包

permissions:
  contents: write

# 强制 JS action 走 Node 24，避免 Node 20 弃用警告（如 softprops/action-gh-release@v2）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - trae
  workflow_dispatch:

concurrency:
  group: trae-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64_v8a
            task: assembleArm64_v8aRelease
          - name: armeabi_v7a
            task: assembleArmeabi_v7aRelease
    steps:
      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          # 拉取完整历史，保证 versionCode 取到准确的 git 提交数
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5

      - name: 编译 ${{ matrix.name }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} --parallel --build-cache

      - name: 查看 APK
        run: find app/build/outputs/apk -name "*.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部 APK
        uses: actions/download-artifact@v5
        with:
          pattern: '*'
          merge-multiple: true
          path: apk

      - name: 查看 APK
        run: ls -lh apk

      - name: 发布 trae 发布包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trae-build-${{ github.run_number }}
          name: Ys影视 trae 构建 ${{ github.run_number }}
          body: |
            trae 分支自动打包

            包含：
            - 统一版 ARM64 / ARMv7（手机 / 电视界面运行时切换）
          prerelease: true
          files: |
            apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}