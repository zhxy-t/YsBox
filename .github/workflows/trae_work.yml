name: trae_work 打包
permissions:
  contents: read
# 强制 JS action 走 Node 24，避免 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches:
      - trae_work
      - refactor/cleanup
      - refactor/unified-ui
  workflow_dispatch:
concurrency:
  group: trae-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64_v8a
            task: assembleArm64_v8aRelease
          - name: armeabi_v7a
            task: assembleArmeabi_v7aRelease
    steps:
      - name: 拉取源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: 缓存 Python 3.10
        uses: actions/cache@v4
        with:
          path: ~/py310
          key: py310-3.10.14-ubuntu26-v1
      - name: 准备 Python 3.10（Chaquopy 要求构建 Python 与目标 3.10 一致）
        run: |
          # 不用 actions/setup-python：它要从 GitHub Releases 下载，近期频繁 504。
          # 改为从 python.org 取源码本地编译，并配合上面的缓存复用。
          if [ ! -x "$HOME/py310/bin/python3.10" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential zlib1g-dev libncurses-dev libgdbm-dev \
              libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev libbz2-dev liblzma-dev
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/py310.tgz \
              https://www.python.org/ftp/python/3.10.14/Python-3.10.14.tgz
            tar -xzf /tmp/py310.tgz -C /tmp
            cd /tmp/Python-3.10.14
            ./configure --prefix="$HOME/py310" >/dev/null
            make -j"$(nproc)" >/dev/null
            make install >/dev/null
          fi
          echo "$HOME/py310/bin" >> "$GITHUB_PATH"
      - name: 校验 Python 3.10
        run: python3.10 --version
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5
      - name: 编译 ${{ matrix.name }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} --parallel --build-cache
      - name: 查看 APK
        run: find app/build/outputs/apk -name "*.apk"
      - name: 上传 APK（仅 Artifacts，不发 Release）
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
