name: trae_work 打包
permissions:
  contents: read
on:
  push:
    branches:
      - trae_work
      - refactor/cleanup
      - refactor/unified-ui
  workflow_dispatch:
concurrency:
  group: trae-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64_v8a
            task: assembleArm64_v8aRelease
          - name: armeabi_v7a
            task: assembleArmeabi_v7aRelease
    steps:
      - name: 拉取源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: 配置 Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5
      - name: 编译 ${{ matrix.name }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} --parallel --build-cache
      - name: 查看 APK
        run: find app/build/outputs/apk -name "*.apk"
      - name: 上传 APK（仅 Artifacts，不发 Release）
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
