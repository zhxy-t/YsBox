name: trae_work 打包
permissions:
  contents: read
# 强制 JS action 走 Node 24，避免 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches:
      - trae_work
      - refactor/cleanup
      - refactor/unified-ui
  workflow_dispatch:
concurrency:
  group: trae-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64_v8a
            task: assembleArm64_v8aRelease
          - name: armeabi_v7a
            task: assembleArmeabi_v7aRelease
    steps:
      - name: 拉取源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: 使用构建机自带 Python
        run: |
          # 不再走 actions/setup-python：它要从 GitHub Releases 下载 Python，
          # 近期该下载源频繁 504，导致构建在准备阶段就失败。
          # Chaquopy 17 允许任意 3.9+ 的构建 Python，直接用镜像自带的即可。
          python3 --version
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5
      - name: 编译 ${{ matrix.name }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} --parallel --build-cache
      - name: 查看 APK
        run: find app/build/outputs/apk -name "*.apk"
      - name: 上传 APK（仅 Artifacts，不发 Release）
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
